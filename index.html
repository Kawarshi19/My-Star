<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Our stars</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,500&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#fff0f6;--soft:#d9b7ff;--pink:#ff8fbd;--gold:#ffe9a8;color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(ellipse at 50% 0%,#3a1458 0%,#1a0c3a 45%,#0a0720 100%) fixed;color:var(--ink);font-family:"Nunito",system-ui,sans-serif;font-size:18px;line-height:1.6;min-height:100vh;overflow-x:hidden}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
main{position:relative;z-index:1;max-width:34rem;margin:0 auto;padding:1.6rem 1.2rem 3rem;text-align:center}
h1{font-family:"Fraunces",Georgia,serif;font-style:italic;font-weight:500;font-size:clamp(2.6rem,12vw,4rem);margin:0;color:#ffd1e3;line-height:1.05}
.sub{color:var(--soft);margin:.4rem 0 0}
#count{display:inline-block;margin-top:.8rem;font-weight:700;color:var(--gold)}
.sky{position:relative;width:min(92vw,420px);aspect-ratio:1;margin:1.4rem auto 0}
.sky svg{position:absolute;inset:0;width:100%;height:100%}
.sky line{stroke:var(--pink);stroke-width:.7;stroke-linecap:round;opacity:0;transition:opacity 1s}
.sky line.on{opacity:.9}
.sky.done line{stroke-width:1;filter:drop-shadow(0 0 2px var(--pink))}
.st{position:absolute;width:52px;height:52px;transform:translate(-50%,-50%);background:none;border:0;padding:0;cursor:pointer;color:var(--gold);font-size:30px;line-height:1;text-shadow:0 0 10px var(--gold),0 0 22px rgba(255,233,168,.6);animation:pulse 2.4s ease-in-out infinite}
.st:nth-of-type(2n){animation-delay:.8s}.st:nth-of-type(3n){animation-delay:1.5s}
.st.on{color:#fff;text-shadow:0 0 12px var(--pink),0 0 28px var(--pink);animation:none;transform:translate(-50%,-50%) scale(1.15)}
.st:focus-visible{outline:2px solid #fff;outline-offset:2px;border-radius:50%}
@keyframes pulse{0%,100%{opacity:.55;transform:translate(-50%,-50%) scale(.9)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}}
.me{position:absolute;left:50%;top:53%;width:25%;aspect-ratio:1;transform:translate(-50%,-50%) scale(.6);border-radius:50%;border:3px solid #fff;object-fit:cover;opacity:0;transition:opacity 1.6s,transform 1.6s;box-shadow:0 0 18px var(--pink),0 0 50px rgba(255,143,189,.7)}
.sky.done .me{opacity:1;transform:translate(-50%,-50%) scale(1)}
.card{min-height:8.5rem;margin:1.6rem auto 0;padding:1.3rem 1.2rem;border-radius:22px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(6px);display:flex;flex-direction:column;justify-content:center;gap:.5rem}
.card p{margin:0;font-family:"Fraunces",Georgia,serif;font-style:italic;font-size:1.3rem;line-height:1.4}
.card small{color:var(--soft)}
button.wish{font:inherit;font-weight:700;cursor:pointer;background:var(--pink);color:#2a0f3e;border:0;border-radius:999px;padding:.8rem 2rem;margin-top:1.2rem;box-shadow:0 0 24px rgba(255,143,189,.6)}
button.wish[hidden]{display:none}
.btns{display:flex;gap:.8rem;justify-content:center;flex-wrap:wrap;margin-top:1.2rem}
.btns button{margin-top:0}
button.again{background:transparent;color:var(--ink);border:2px solid var(--pink);box-shadow:none}
button.wish:focus-visible{outline:3px solid #fff;outline-offset:3px}
@media (prefers-reduced-motion:reduce){.st{animation:none;opacity:1}.me,.sky line{transition:none}}
</style>
</head>
